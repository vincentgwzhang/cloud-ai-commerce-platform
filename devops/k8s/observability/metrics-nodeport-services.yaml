# External Prometheus scrape targets (Minikube NodePort).
# Business traffic stays on ClusterIP services; these expose /actuator/prometheus only.
# Apply: devops/script/observability/minikube-metrics-apply.sh
#
# Fixed nodePorts — Prometheus in docker-compose (minikube network) scrapes host "minikube:<port>".
apiVersion: v1
kind: Service
metadata:
  name: auth-service-metrics
  labels:
    app: auth-service
    observability: metrics
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
    - name: metrics
      port: 80
      targetPort: 8080
      nodePort: 30080
