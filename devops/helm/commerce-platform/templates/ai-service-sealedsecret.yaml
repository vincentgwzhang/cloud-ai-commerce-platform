{{- if .Values.sealedSecrets.aiServiceOpenaiKey }}
# Encrypted at rest — safe to commit. The sealed-secrets controller decrypts this
# into a normal Secret named "ai-service-secret" (consumed by ai-service via envFrom).
# Populate the ciphertext with: devops/argocd/sealed-secrets/seal-ai-openai-key.sh
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ai-service-secret
  namespace: {{ include "commerce-platform.namespace" . }}
  labels:
    {{- include "commerce-platform.serviceLabels" (dict "root" . "appName" "ai-service") | nindent 4 }}
spec:
  encryptedData:
    OPENAI_API_KEY: {{ .Values.sealedSecrets.aiServiceOpenaiKey | quote }}
  template:
    metadata:
      name: ai-service-secret
      namespace: {{ include "commerce-platform.namespace" . }}
    type: Opaque
{{- end }}
