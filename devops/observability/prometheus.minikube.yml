# Minikube scrape config — use with docker-compose-observability-minikube.yml
# Prometheus joins Docker network "minikube"; hostname "minikube" resolves to the Minikube node.
# Requires: devops/k8s/observability/metrics-nodeport-services.yaml applied in the cluster.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["minikube:30080"]

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["minikube:30081"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["minikube:30082"]

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["minikube:30083"]

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["minikube:30088"]
