apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "docker"
  # Reach MySQL on the Ubuntu host from inside Minikube pods
  DB_HOST: "host.minikube.internal"
  DB_PORT: "3306"
  DB_NAME: "commerce_platform"
  JWT_ISSUER: "auth-service"
  JWT_EXPIRATION_SECONDS: "3600"
  JWT_REFRESH_EXPIRATION_SECONDS: "604800"
  JWT_PRIVATE_KEY_PATH: "file:/app/keys/private.pem"
  JWT_PUBLIC_KEY_PATH: "file:/app/keys/public.pem"
