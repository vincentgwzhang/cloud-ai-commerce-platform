server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: product-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:commerce_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:vincent}
    password: ${DB_PASSWORD:1q2w3e4R}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ProductServiceHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    issuer: ${JWT_ISSUER:auth-service}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:../devops/data/keys/public.pem}
    public-key-fallback-paths:
      - file:devops/data/keys/public.pem
      - file:../devops/data/keys/public.pem
  cache:
    product:
      detail-ttl: ${PRODUCT_CACHE_DETAIL_TTL:10m}
      hot-ttl: ${PRODUCT_CACHE_HOT_TTL:30m}
      null-cache-ttl: ${PRODUCT_CACHE_NULL_TTL:2m}
      lock-ttl: ${PRODUCT_CACHE_LOCK_TTL:30s}
      local-cache-ttl: ${PRODUCT_LOCAL_CACHE_TTL:30s}
      ttl-jitter-max-seconds: ${PRODUCT_CACHE_JITTER_SECONDS:60}
      hot-product-ids:
        - 1
        - 2
        - 3

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.vincent.productservice: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] [%X{traceId:-}] %logger{36} - %msg%n"
