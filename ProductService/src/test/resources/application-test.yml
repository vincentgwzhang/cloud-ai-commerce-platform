spring:
  datasource:
    url: jdbc:h2:mem:product_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/test-schema.sql
      data-locations: classpath:sql/test-data.sql
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    issuer: auth-service-test
    public-key-path: classpath:keys/public.pem
  cache:
    product:
      ttl: 10m
      lock-ttl: 5s
      key-prefix: "test:product:"
      hot-product-ids: 1,2,3

logging:
  level:
    root: WARN
    com.vincent.productservice: INFO
