spring:
  datasource:
    url: jdbc:h2:mem:inventory_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/test-schema.sql
      data-locations: classpath:sql/test-data.sql
  kafka:
    listener:
      auto-startup: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    issuer: auth-service-test
    public-key-path: classpath:keys/public.pem
  inventory:
    cache-ttl: PT5M
    idempotency-ttl: PT1H
    lock-ttl: PT10S
    local-cache-ttl: PT30S
    ttl-jitter-max-seconds: 0
    hot-product-codes:
      - IPHONE17
  kafka:
    max-retries: 1
    retry-interval-ms: 100
    topics:
      order-created: order-created
      inventory-reserved: inventory-reserved
      inventory-failed: inventory-failed
      inventory-dlq: inventory-dlq
