spring:
  application:
    name: inventory-service
  profiles:
    default: local
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:commerce_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:vincent}
    password: ${DB_PASSWORD:1q2w3e4R}
    hikari:
      pool-name: InventoryServiceHikariPool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8082}

app:
  jwt:
    issuer: ${JWT_ISSUER:auth-service}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:file:../devops/data/keys/public.pem}
    public-key-fallback-paths:
      - file:devops/data/keys/public.pem
      - file:../devops/data/keys/public.pem
  inventory:
    cache-key-prefix: "inventory:product:"
    cache-ttl: PT30M
    idempotency-prefix: "inventory:idempotency:"
    idempotency-ttl: PT24H
    lock-prefix: "inventory:lock:"
    lock-ttl: PT10S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
